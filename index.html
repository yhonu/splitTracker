<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Split Tracker</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mut:#77756e;--ac:#0f766e;--bd:#e3e1d9;--neg:#b42318;--pos:#067647}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--card:#1f1f1d;--tx:#f0efe9;--mut:#9a988f;--ac:#2dd4bf;--bd:#34332f;--neg:#f97066;--pos:#47cd89}}
:root[data-theme="dark"]{--bg:#141413;--card:#1f1f1d;--tx:#f0efe9;--mut:#9a988f;--ac:#2dd4bf;--bd:#34332f;--neg:#f97066;--pos:#47cd89}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Roboto,sans-serif}
main{max-width:820px;margin:0 auto;padding:12px}
h1{font-size:22px;margin:4px 0 12px;display:flex;justify-content:space-between;align-items:center}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:20px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:8px;min-width:0;overflow:hidden}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;min-width:0}
.grid3,.grid2{display:grid;grid-template-columns:1fr;gap:10px;align-items:stretch}
.grid3>.card,.grid2>.card{margin-bottom:0;min-width:0}
.grid3>.wide{grid-column:1 / -1}
.section-card{height:100%}
.balance-box .balance-total{font-size:24px;font-weight:700;margin:2px 0 8px}
.balance-box .balance-status{margin-bottom:10px}
.balance-box .balance-list{display:grid;gap:6px}
.balance-box .balance-item{padding:9px 10px;border:1px solid var(--bd);border-radius:9px;background:var(--bg)}
.balance-box .balance-item .mut{margin-top:2px}
.balance-box select{margin-bottom:8px}
input,select,button{font:inherit;color:inherit;border:1px solid var(--bd);border-radius:8px;padding:10px;background:var(--card);min-width:0}
input,select{width:100%;margin-bottom:8px}
button{cursor:pointer}
.pri{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
.sm{padding:6px 10px;font-size:14px}
.mut{color:var(--mut);font-size:14px}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.chips label{display:inline-flex;gap:6px;align-items:center;margin:0 10px 6px 0}
.chips input{width:auto;margin:0}
.chip{display:inline-block;background:var(--bg);border:1px solid var(--bd);border-radius:99px;padding:4px 10px;margin:0 6px 6px 0;font-size:14px}
.x{border:0;background:none;color:var(--mut);padding:0 0 0 6px}
a.back{color:var(--ac);cursor:pointer;font-size:14px}


/* Responsive layout: one column on phones, two columns on wider screens. */
.app-grid{display:grid;grid-template-columns:1fr;gap:0}
.section-card{min-width:0}

@media(min-width:700px){
  main{padding:18px}
  .app-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .app-grid .wide{grid-column:1 / -1}
  .grid3,.grid2{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
}

@media(max-width:699px){
  body{font-size:16px}
  input,select,button{min-height:44px}
  .row{gap:10px}
  .card{padding:12px}
  .chip{padding:6px 10px}
}

@media(max-width:380px){
  main{padding:10px}
  h1{font-size:20px}
  .row{align-items:flex-start}
  .card{padding:12px}
}
</style></head><body><main id="app"></main>
<script>
let S={cur:"₱",groups:[]},gid=null;
try{const r=localStorage.getItem("split-v1");if(r)S=JSON.parse(r)}catch(e){}
const save=()=>{try{localStorage.setItem("split-v1",JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let pend=null,pt;
function toast(m){let t=$("#toast");if(!t){t=document.createElement("div");t.id="toast";t.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:9";document.body.appendChild(t)}t.textContent=m;t.style.display="block";clearTimeout(t.h);t.h=setTimeout(()=>t.style.display="none",2500)}
function ask(k,m){if(pend===k){pend=null;return true}pend=k;toast(m);clearTimeout(pt);pt=setTimeout(()=>pend=null,2500);return false}
const uid=()=>Math.random().toString(36).slice(2,9);
const money=c=>S.cur+(c/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const G=()=>S.groups.find(g=>g.id===gid);

function balances(g){
  const b={};g.people.forEach(p=>b[p]=0);
  g.expenses.forEach(e=>{
    b[e.payer]=(b[e.payer]||0)+e.amt;
    if(e.type==="settle"){b[e.to]=(b[e.to]||0)-e.amt;return}
    const n=e.billed.length,base=Math.floor(e.amt/n);let rem=e.amt-base*n;
    e.billed.forEach(p=>{b[p]=(b[p]||0)-(base+(rem-->0?1:0))});
  });
  return b;
}
function transfers(b){
  const d=[],c=[];
  Object.entries(b).forEach(([p,v])=>{if(v<0)d.push([p,-v]);else if(v>0)c.push([p,v])});
  const out=[];
  while(d.length&&c.length){
    d.sort((a,z)=>z[1]-a[1]);c.sort((a,z)=>z[1]-a[1]);
    const m=Math.min(d[0][1],c[0][1]);
    out.push({from:d[0][0],to:c[0][0],amt:m});
    d[0][1]-=m;c[0][1]-=m;
    if(!d[0][1])d.shift();if(!c[0][1])c.shift();
  }
  return out;
}

function home(){
  $("#app").innerHTML=`<h1>Split Tracker ${editCur?`<input id="ci" value="${esc(S.cur)}" maxlength="4" style="width:80px;margin:0" onchange="setCur(this.value)" onblur="setCur(this.value)">`:`<button class="sm" onclick="cur()">${esc(S.cur)}</button>`}</h1>
  <div class="card"><input id="gn" placeholder='New group, e.g. "Trip 1" or "Dinner 1"'><button class="pri" style="width:100%" onclick="addGroup()">Create group</button></div>
  <h2>Groups</h2>`+(S.groups.length?S.groups.map(g=>{
    const t=g.expenses.filter(e=>e.type!=="settle").reduce((s,e)=>s+e.amt,0);
    return `<div class="card row" onclick="gid='${g.id}';group()" style="cursor:pointer"><div><b>${esc(g.name)}</b><div class="mut">${g.people.length} people · ${money(t)}</div></div><span class="mut">›</span></div>`}).join(""):'<p class="mut">No groups yet.</p>')+
  `<h2>Backup</h2><div class="card row"><button onclick="exp()">Export JSON</button><button onclick="$('#imp').click()">Import JSON</button><input id="imp" type="file" accept=".json" hidden onchange="imp(this)"></div>`;
}
let editCur=false;function cur(){editCur=true;home();$("#ci").focus()}
function setCur(v){S.cur=v.trim();editCur=false;save();home()}
function addGroup(){const n=$("#gn").value.trim();if(!n)return;const g={id:uid(),name:n,people:[],expenses:[]};S.groups.push(g);save();gid=g.id;group()}
function exp(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="split-tracker-backup.json";a.click()}
function imp(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.groups))throw 0;S=d;save();home()}catch(e){toast("Invalid backup file")}};r.readAsText(f)}

function group(){
  const g=G();if(!g)return home();
  const total=g.expenses.filter(e=>e.type!=="settle").reduce((s,e)=>s+e.amt,0);
  const opts=g.people.map(p=>`<option>${esc(p)}</option>`).join("");
  $("#app").innerHTML=`<a class="back" onclick="home()">‹ All groups</a>
  <h1>${esc(g.name)} <button class="sm" onclick="delGroup()">Delete</button></h1>
  <div class="grid3">
    <div class="card"><div class="mut">Total expenses</div><b style="font-size:24px">${money(total)}</b></div>
    <div class="card"><div class="mut">People</div>
      ${g.people.map((p,i)=>`<span class="chip">${esc(p)}<button class="x" onclick="rmPerson(${i})">✕</button></span>`).join("")||'<span class="mut">Add the people in this group.</span>'}
      <div class="row" style="margin-top:8px"><input id="pn" placeholder="Name" style="margin:0" onkeydown="if(event.key==='Enter')addPerson()"><button class="pri" onclick="addPerson()">Add</button></div>
    </div>
    ${g.people.length>=2?`<div class="grid2 wide">
      <div class="card">
        <div class="mut">Add expense</div>
        <input id="ed" placeholder="What for? (e.g. Hotel)"><input id="ea" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Amount">
        <div class="mut">Paid by</div><select id="ep">${opts}</select>
        <div class="mut">Billed to (split evenly)</div><div class="chips" id="eb">${g.people.map(p=>`<label><input type="checkbox" value="${esc(p)}" checked>${esc(p)}</label>`).join("")}</div>
        <button class="pri" style="width:100%" onclick="addExp()">Add expense</button>
      </div>
      <div class="card balance-box" id="balanceBox">
        ${balanceBox(g)}
      </div>
    </div>`:'<div class="card"><div class="mut">Add expense</div><p class="mut">Add at least 2 people to start tracking expenses.</p></div>'}
  </div>
  ${g.people.length>=2?`${detail(g)}<h2>History</h2>`:''}`+
  (g.people.length>=2?(g.expenses.length?`<div class="grid3">`+[...g.expenses].reverse().map(e=>e.type==="settle"?
    `<div class="card row"><div><b>${esc(e.payer)}</b> paid <b>${esc(e.to)}</b><div class="mut">Settlement</div></div><div>${money(e.amt)} <button class="x" style="font-size:20px;padding:4px 8px" onclick="rmExp('${e.id}')">✕</button></div></div>`:
    `<div class="card row"><div><b>${esc(e.desc)}</b><div class="mut">${esc(e.payer)} paid · billed to ${e.billed.map(esc).join(", ")}</div></div><div>${money(e.amt)} <button class="x" style="font-size:20px;padding:4px 8px" onclick="rmExp('${e.id}')">✕</button></div></div>`).join("")+`</div>`:'<p class="mut">No expenses yet.</p>'):'');
}

function balanceBox(g,selected=""){
  const b=balances(g);
  const person=selected||"";
  const net=b[person]||0;
  const outgoing=person?transfers(b).filter(t=>t.from===person):[];
  const incoming=person?transfers(b).filter(t=>t.to===person):[];
  
  const getExpensesBetween=(p1,p2)=>{
    return g.expenses.filter(e=>
      e.type!=="settle"&&
      ((e.payer===p1&&e.billed.includes(p2))||(e.payer===p2&&e.billed.includes(p1)))
    );
  };

  let body="";
  if(!person){
    body=`<div class="mut">Select a name to see their balance.</div>`;
  }else if(net===0){
    body=`<div class="balance-status pos"><b>${esc(person)}</b> is settled.</div>`;
  }else{
    const rows=[];
    
    outgoing.forEach(t=>{
      const relatedExps=getExpensesBetween(t.from,t.to);
      const expDetails=relatedExps.length
        ?`<div class="mut" style="font-size:12px;margin-top:4px">Includes: ${relatedExps.map(e=>esc(e.desc)).join(", ")}</div>`
        :"";

      rows.push(`
        <div class="balance-item">
          <div>
            <b>${esc(t.from)}</b> owes <b>${esc(t.to)}</b>
            ${expDetails}
          </div>
          <div class="neg">${money(t.amt)}</div>
        </div>
      `);
    });

    incoming.forEach(t=>{
      const relatedExps=getExpensesBetween(t.from,t.to);
      const expDetails=relatedExps.length
        ?`<div class="mut" style="font-size:12px;margin-top:4px">Includes: ${relatedExps.map(e=>esc(e.desc)).join(", ")}</div>`
        :"";

      rows.push(`
        <div class="balance-item">
          <div>
            <b>${esc(t.from)}</b> owes <b>${esc(t.to)}</b>
            ${expDetails}
          </div>
          <div class="pos">${money(t.amt)} to receive</div>
        </div>
      `);
    });

    body=rows.length?`<div class="balance-list">${rows.join("")}</div>`:`<div class="mut">No outstanding balances.</div>`;
  }

  return `<div class="mut">Balance by person</div>
    <select onchange="updateBalanceBox(this.value)">
      <option value="">Select a name</option>
      ${g.people.map(p=>`<option value="${esc(p)}"${p===person?" selected":""}>${esc(p)}</option>`).join("")}
    </select>
    ${person?`<div class="balance-total">${money(Math.abs(net))}</div>
      <div class="balance-status ${net<0?"neg":net>0?"pos":"mut"}">${net<0?`${esc(person)} owes ${money(-net)} total`:net>0?`${esc(person)} should receive ${money(net)} total`:`${esc(person)} is settled`}</div>`:""}
    ${body}`;
}

function updateBalanceBox(person){
  const g=G();
  const box=$("#balanceBox");
  if(box) box.innerHTML=balanceBox(g,person);
}

function detail(g){
  const sh=e=>{const n=e.billed.length,base=Math.floor(e.amt/n);let rem=e.amt-base*n;return e.billed.map(p=>[p,base+(rem-->0?1:0)])};
  const P={};
  const add=(from,to,amt,label,settle)=>{const a=from<to?from:to,b=from<to?to:from,k=a+"\u0001"+b;(P[k]=P[k]||{a,b,items:[]}).items.push({from,to,amt,label,settle})};
  g.expenses.forEach(e=>{
    if(e.type==="settle"){add(e.payer,e.to,e.amt,"Payment",true);return}
    sh(e).forEach(([p,v])=>{if(p!==e.payer)add(p,e.payer,v,e.desc,false)});
  });
  const pairs=Object.values(P).map(x=>{
    const net=x.items.reduce((s,i)=>s+(i.from===x.a?1:-1)*(i.settle?-1:1)*i.amt,0);
    const sum=net>0?`<b>${esc(x.a)}</b> owes <b>${esc(x.b)}</b> <span class="neg">${money(net)}</span>`:net<0?`<b>${esc(x.b)}</b> owes <b>${esc(x.a)}</b> <span class="neg">${money(-net)}</span>`:`<b>${esc(x.a)}</b> &amp; <b>${esc(x.b)}</b> <span class="mut">settled</span>`;
    const lines=x.items.map(i=>`<div class="row mut" style="margin:4px 0"><span>${esc(i.label)}: ${esc(i.from)} ${i.settle?"paid":"owes"} ${esc(i.to)}</span><span class="${i.settle?"pos":"neg"}">${i.settle?"−":"+"}${money(i.amt)}</span></div>`).join("");
    return `<details class="card"><summary>${sum}</summary><div style="margin-top:8px">${lines}</div></details>`}).join("");
  return `<h2>Expense balances by person</h2>${pairs?`<div class="grid3">${pairs}</div>`:'<p class="mut">Nothing to show yet.</p>'}<p class="mut">These are the direct balances created by individual expenses.</p>`;
}
function addPerson(){const g=G(),n=$("#pn").value.trim();if(!n)return;if(g.people.some(p=>p.toLowerCase()===n.toLowerCase()))return toast("Name already exists");g.people.push(n);save();group()}
function rmPerson(i){const g=G(),p=g.people[i];if(g.expenses.some(e=>e.payer===p||e.to===p||(e.billed||[]).includes(p)))return toast(p+" is part of existing expenses. Delete those first.");g.people.splice(i,1);save();group()}
function addExp(){
  const g=G(),desc=$("#ed").value.trim()||"Expense",amt=Math.round(parseFloat($("#ea").value)*100),payer=$("#ep").value;
  const billed=[...document.querySelectorAll("#eb input:checked")].map(i=>i.value);
  if(!(amt>0))return toast("Enter an amount");if(!billed.length)return toast("Pick who it's billed to");
  g.expenses.push({id:uid(),type:"exp",desc,amt,payer,billed});save();group();
}
function rmExp(id){if(!ask("e"+id,"Tap ✕ again to delete"))return;const g=G();g.expenses=g.expenses.filter(e=>e.id!==id);save();group()}
function delGroup(){if(!ask("g","Tap Delete again to remove this group"))return;S.groups=S.groups.filter(g=>g.id!==gid);save();home()}
home();
</script></body></html>
